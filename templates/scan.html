{% extends "base.html" %}
{% block content %}
<div class="formbox" style="text-align: center; max-width: 600px;">
    <h2>{{ t.scan_qr }}</h2>
    <p>{{ t.scan_instruction }}</p>
    
    <div id="reader" style="width: 100%; max-width: 500px; margin: 20px auto;"></div>
    
    <button id="start-btn" class="btn">{{ t.start_scanner }}</button>
    <button id="stop-btn" class="btn dark" style="display:none;">{{ t.stop_scanner }}</button>
    <br><br>
    <a class="btn secondary" href="{{ url_for('admin_dashboard') }}">{{ t.back_to_admin }}</a>
</div>

<script src="https://unpkg.com/html5-qrcode"></script>
<script>
    const html5QrCode = new Html5Qrcode("reader");
    const startBtn = document.getElementById("start-btn");
    const stopBtn = document.getElementById("stop-btn");

    function onScanSuccess(decodedText, decodedResult) {
        // Stop scanning
        html5QrCode.stop().then((ignore) => {
            // Redirect to the URL from the QR code (which is the verify URL)
            window.location.href = decodedText;
        }).catch((err) => {
            console.error(err);
        });
    }

    startBtn.addEventListener("click", () => {
        html5QrCode.start(
            { facingMode: "environment" }, // Prefer back camera
            { fps: 10, qrbox: {width: 250, height: 250} },
            onScanSuccess,
            (errorMessage) => {
                // parse error, ignore
            }
        ).then(() => {
            startBtn.style.display = "none";
            stopBtn.style.display = "inline-block";
        }).catch((err) => {
            alert("Error starting scanner: " + err);
        });
    });

    stopBtn.addEventListener("click", () => {
        html5QrCode.stop().then(() => {
            startBtn.style.display = "inline-block";
            stopBtn.style.display = "none";
        }).catch((err) => {
            console.error(err);
        });
    });
</script>
{% endblock %}
