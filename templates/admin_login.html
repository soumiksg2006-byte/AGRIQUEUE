{% extends "base.html" %}
{% block content %}
<div class="formbox">

<label>{{ t.username }}</label><input name="username" required>
<label>{{ t.password }}</label><input type="password" name="password" required>
<button class="btn">{{ t.login_button }}</button>
</form>

</div>
{% endblock %}
